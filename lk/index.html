/* ============================================================
   AnalyseDreams — Color tokens
   Deep navy ink on a cyan-tinted paper, with a cream/ivory
   "emblem" tone and luminous cyan starlight accents.
   ============================================================ */

:root {
  /* ---- Brand navy (ink) scale -------------------------------- */
  --navy-900: #0f1a2e;   /* deepest — overlays, night sky      */
  --navy-800: #172236;   /* PRIMARY brand ink / emblem circle   */
  --navy-700: #1e2d44;
  --navy-600: #28425f;   /* secondary ink, links on light       */
  --navy-500: #3a546f;

  /* ---- Paper / surface scale (cyan-tinted whites) ------------ */
  --paper-000: #ffffff;
  --paper-050: #f9ffff;  /* app background                      */
  --paper-100: #eef8fb;  /* soft section fill                   */
  --paper-200: #ddf0f5;
  --paper-300: #ccebf0;  /* accent fill / chips                 */

  /* ---- Cream / ivory (logo + warm imagery) ------------------- */
  --cream-100: #f4eede;
  --cream-200: #ece4d4;  /* emblem background                   */
  --cream-300: #e0d4bd;

  /* ---- Starlight cyan (decorative accent) -------------------- */
  --cyan-100: #e6f8fd;
  --cyan-200: #d8f4fb;   /* sparkle glow                        */
  --cyan-300: #bfe9f4;   /* primary cyan accent                 */
  --cyan-400: #8fd6e8;   /* deeper cyan                         */
  --cyan-500: #5cbcd4;

  /* ---- Dusk lavender (from imagery, supporting) ------------- */
  --dusk-200: #d7dfef;
  --dusk-300: #b9c6e2;
  --dusk-400: #8093bd;

  /* ---- Functional ------------------------------------------- */
  --success-500: #3f9d7a;
  --warning-500: #d8a23c;
  --danger-500:  #c2566b;

  /* ============================================================
     Semantic aliases — prefer these in components
     ============================================================ */

  /* Text */
  --text-strong:  var(--navy-800);
  --text-body:    var(--navy-700);
  --text-muted:   rgba(23, 34, 54, 0.64);
  --text-faint:   rgba(23, 34, 54, 0.42);
  --text-inverse: var(--paper-050);
  --text-link:    var(--navy-600);

  /* Surfaces */
  --surface-app:     var(--paper-050);
  --surface-soft:    var(--paper-100);
  --surface-card:    rgba(255, 255, 255, 0.82);
  --surface-raised:  var(--paper-000);
  --surface-accent:  var(--paper-300);
  --surface-night:   var(--navy-800);

  /* Borders */
  --border-subtle:  rgba(23, 34, 54, 0.12);
  --border-strong:  rgba(23, 34, 54, 0.22);
  --border-onnight: rgba(249, 255, 255, 0.56);

  /* Accent / interactive */
  --accent:          var(--navy-800);
  --accent-contrast: var(--paper-050);
  --accent-glow:     var(--cyan-300);

  /* Overlay scrims used on full-bleed imagery */
  --scrim-soft: linear-gradient(180deg, rgba(15,26,46,0.10) 0%, rgba(11,20,38,0.34) 100%); /* @kind color */
  --scrim-deep: linear-gradient(180deg, rgba(17,24,45,0.04) 0%, rgba(17,24,45,0.52) 100%); /* @kind color */

  /* Signature page background wash */
  --bg-wash:
    radial-gradient(920px 580px at 12% 2%, rgba(186,234,245,0.72), transparent 58%),
    radial-gradient(820px 560px at 96% 8%, rgba(23,34,54,0.12), transparent 60%),
    linear-gradient(180deg, #edf8fb 0%, #f9ffff 28%, #f9ffff 100%),
    var(--paper-050); /* @kind color */
}

/* ============================================================
   AnalyseDreams — Typography tokens
   Single family: Manrope. Tight, low line-height display
   headings (letter-spacing -0.02em, line-height ~0.95) over
   calm, readable body. Russian-first, Latin-ready.
   ============================================================ */

:root {
  /* Families */
  --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Manrope", system-ui, sans-serif;

  /* Weights */
  --weight-regular: 400;
  --weight-medium:  500;
  --weight-semibold: 600;
  --weight-bold:    700;
  --weight-black:   800;

  /* Fluid display sizes (hero / section headers) */
  --display-2xl: clamp(2.7rem, 4.5vw, 4.55rem); /* @kind font */
  --display-xl:  clamp(1.8rem, 3.4vw, 3.6rem);  /* @kind font */
  --display-lg:  clamp(1.6rem, 2.6vw, 2.5rem);  /* @kind font */
  --display-md:  clamp(1.45rem, 2vw, 1.95rem);  /* @kind font */

  /* Static text sizes */
  --text-3xl: 2rem;
  --text-2xl: 1.5rem;
  --text-xl:  1.3rem;
  --text-lg:  1.125rem;
  --text-md:  1rem;       /* base body                          */
  --text-sm:  0.92rem;
  --text-xs:  0.82rem;
  --text-2xs: 0.72rem;    /* eyebrow / kicker                   */

  /* Line heights */
  --leading-display: 0.95;  /* tight display                    */
  --leading-snug:    1.15;
  --leading-body:    1.5;
  --leading-relaxed: 1.62;

  /* Letter spacing */
  --tracking-display: -0.02em;
  --tracking-tight:   -0.01em;
  --tracking-normal:  0;
  --tracking-eyebrow: 0.12em;  /* uppercase eyebrow             */

  /* Semantic roles */
  --type-eyebrow-size:   var(--text-2xs);
  --type-eyebrow-weight: var(--weight-black);
  --type-body-size:      var(--text-md);
  --type-body-weight:    var(--weight-regular);
}

/* Optional helper classes (components prefer the vars directly) */
.ad-eyebrow {
  margin: 0;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: var(--type-eyebrow-size);
  font-weight: var(--type-eyebrow-weight);
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
}

.ad-display {
  margin: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-black);
  line-height: var(--leading-display);
  letter-spacing: var(--tracking-display);
  color: var(--text-strong);
}

/* ============================================================
   AnalyseDreams — Spacing, radii, shadows, layout
   Generous, airy rhythm. Large soft radii (14–30px) and
   diffuse, low-opacity navy shadows. No hard borders on cards.
   ============================================================ */

:root {
  /* Spacing scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-28: 112px;     /* between major sections             */

  /* Radii */
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-2xl: 30px;
  --radius-pill: 999px;

  /* Shadows — diffuse, navy-tinted, no spread */
  --shadow-xs: 0 2px 8px rgba(23, 34, 54, 0.06);
  --shadow-sm: 0 10px 24px rgba(23, 34, 54, 0.08);
  --shadow-md: 0 18px 40px rgba(23, 34, 54, 0.12);
  --shadow-lg: 0 22px 60px rgba(23, 34, 54, 0.12);
  --shadow-xl: 0 32px 70px rgba(0, 0, 0, 0.28);   /* on imagery */
  --shadow-glow: 0 0 32px rgba(191, 233, 244, 0.55); /* cyan    */

  /* Buttons */
  --button-height: 56px;
  --button-pad-x: 24px;
  --button-radius: var(--radius-lg);

  /* Layout */
  --container: 1344px;
  --container-narrow: 720px;
  --gutter: 32px;

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */
  --dur-fast: 160ms; /* @kind other */
  --dur-base: 240ms; /* @kind other */
  --dur-slow: 420ms; /* @kind other */
}

  const fbMap = { "dotted-l": DECOR + "/Str Union_L.PNG", "dotted-m": DECOR + "/Str Union_m.PNG", "dotted-s": DECOR + "/Str Union_s.PNG", "sparkle": DECOR + "/Vector_star.PNG" };
  return <img src={assetUrl(keyMap[k], fbMap[k])} alt="" aria-hidden="true" style={{ display: "block", width: size, height: "auto", opacity, pointerEvents: "none", ...style }} />;
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

/* ---------- Dream dialogue engine ---------- */
const API_BASE = 'https://api.analysedreams.ru';

async function callAnalyse(email, apiMsgs, isEnded) {
  const res = await fetch(`${API_BASE}/analyse/run`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, dream_title: '', is_ended: isEnded, messages: apiMsgs }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw Object.assign(new Error(body.detail || `HTTP ${res.status}`), { status: res.status });
  }
  return res.json();
}

function Bubble({ from, children }) {
  const isBot = from === "bot";
  return (
    <div style={{ display: "flex", justifyContent: isBot ? "flex-start" : "flex-end" }}>

}

}

// Depth indicator — dots fill as the dialogue moves toward the insight.
function DepthMeter({ stage }) {
  const total = 4;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <div style={{ display: "flex", gap: 5 }}>
        {Array.from({ length: total }).map((_, i) => (
          <span key={i} style={{ width: 7, height: 7, borderRadius: 999, background: i < stage ? "var(--cyan-300)" : "rgba(249,255,255,0.25)", transition: "background 240ms var(--ease-out)" }}></span>
        ))}
      </div>
      <span style={{ fontSize: "0.78rem", color: "rgba(249,255,255,0.7)" }}>{stage >= total ? "инсайт найден" : "путь к инсайту"}</span>
    </div>
  );
}

function DreamChat({ open, balance, onClose, onStart, onComplete, onGoTopUp, onBalanceUpdate, initialDream, email }) {
  const greeting = { from: "bot", node: <span>Привет! Расскажите свой сон в нескольких предложениях — а дальше мы разберём его в диалоге: я буду задавать вопросы, вы можете отвечать или спрашивать в ответ, пока не придём к инсайту.</span> };
  const [msgs, setMsgs] = useState([greeting]);
  const [apiMsgs, setApiMsgs] = useState([]);
  const [text, setText] = useState("");
  const [typing, setTyping] = useState(false);
  const [stage, setStage] = useState(0);
  const [done, setDone] = useState(false);
  const [entry, setEntry] = useState(null);
  const [errMsg, setErrMsg] = useState("");
  const scroller = useRef(null);

  useEffect(() => {
    if (open) { setMsgs([greeting]); setText(initialDream || ""); setTyping(false); setStage(0); setDone(false); setEntry(null); setApiMsgs([]); setErrMsg(""); }
  }, [open]);
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight; }, [msgs, typing]);

  if (!open) return null;
  const noBalance = balance <= 0 && stage === 0;

  async function runTurn(newApiMsgs, isEnded) {
    setTyping(true);
    try {
      const data = await callAnalyse(email, newApiMsgs, isEnded);
      setTyping(false);
      const result = data.result;
      const botText = result.messages[result.messages.length - 1].content;
      setApiMsgs([...newApiMsgs, { role: 'assistant', content: botText }]);

      const isInsight = isEnded || newApiMsgs.length >= 7;
      if (isInsight) {
        setMsgs((m) => [...m, { from: "bot", node: <InsightBubble text={botText} /> }]);
        setStage(4);
        setDone(true);
        onComplete({ ...(entry || {}), title: result.dream_title || todayLabel(), insight: botText });
        if (onBalanceUpdate) onBalanceUpdate(data.dreams_balance);
      } else {
        setMsgs((m) => [...m, { from: "bot", node: <span>{botText}</span> }]);
        setStage((s) => s + 1);
      }
    } catch (err) {
      setTyping(false);
      console.error("analyse/run error:", err);
      if (err.status === 402) onGoTopUp();
      else setErrMsg(err.message || "Ошибка соединения с сервером. Попробуйте ещё раз.");
    }
  }

  function send() {
    const value = text.trim();
    if (!value || typing || done) return;
    if (stage === 0 && balance <= 0) return;

    const newApiMsgs = [...apiMsgs, { role: 'user', content: value }];
    setApiMsgs(newApiMsgs);
    setMsgs((m) => [...m, { from: "me", node: <span>{value}</span> }]);
    setText("");

    if (stage === 0) {
      onStart();
      setEntry({ id: Date.now(), date: todayLabel(), dream: value });
    }

    runTurn(newApiMsgs, false);
  }

  function summarizeNow() {
    if (typing || done || stage === 0) return;
    runTurn(apiMsgs, true);
  }

  const hasSent = msgs.some(m => m.from === "me");

  return (
    <div onClick={hasSent ? undefined : onClose} style={{ position: "fixed", inset: 0, zIndex: 70, background: "rgba(11,20,38,0.62)", backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(480px, 100%)", height: "min(700px, 92vh)", background: "var(--surface-soft)", borderRadius: 28, overflow: "hidden", boxShadow: "var(--shadow-xl)", display: "flex", flexDirection: "column" }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 18px", background: "var(--navy-800)", color: "#f9ffff" }}>
          <img src={LOGO} alt="" style={{ width: 40, height: 40, borderRadius: 999, objectFit: "cover" }} />
          <div style={{ flex: 1 }}>
            <p style={{ margin: 0, fontWeight: 700 }}>Разбор сна</p>
            {stage === 0
              ? <p style={{ margin: 0, fontSize: "0.8rem", color: "rgba(249,255,255,0.7)" }}>В балансе: {balance} {plural(balance, "разбор", "разбора", "разборов")}</p>
              : <DepthMeter stage={stage} />}
          </div>
          {!hasSent && (
            <button onClick={onClose} aria-label="Закрыть" style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#f9ffff", width: 32, height: 32, borderRadius: 999, cursor: "pointer", fontSize: 18, lineHeight: 1 }}>×</button>
          )}
        </div>

        {/* Messages */}
        <div ref={scroller} style={{ flex: 1, overflowY: "auto", padding: 18, display: "flex", flexDirection: "column", gap: 12 }}>
          {msgs.map((m, i) => <Bubble key={i} from={m.from}>{m.node}</Bubble>)}
          {typing && <Bubble from="bot"><span style={{ color: "var(--text-muted)" }}>печатает…</span></Bubble>}
          {errMsg && (
            <div style={{ padding: "10px 14px", borderRadius: 12, background: "rgba(194,86,107,0.10)", border: "1px solid rgba(194,86,107,0.3)", color: "var(--danger-500)", fontSize: "0.86rem", lineHeight: 1.4 }}>⚠ {errMsg}</div>
          )}

        </div>

        {/* Composer / states */}
        {noBalance ? (
          <div style={{ padding: 18, borderTop: "1px solid var(--border-subtle)", background: "var(--paper-050)", display: "flex", flexDirection: "column", gap: 10, alignItems: "center", textAlign: "center" }}>
            <p style={{ margin: 0, color: "var(--text-muted)", fontSize: "0.92rem" }}>Разборы закончились. Пополните баланс, чтобы начать беседу.</p>
            <Button fullWidth onClick={onGoTopUp}>Пополнить баланс</Button>
          </div>
        ) : done ? (
          <div style={{ padding: 18, borderTop: "1px solid var(--border-subtle)", background: "var(--paper-050)", display: "flex", flexDirection: "column", gap: 8, alignItems: "center", textAlign: "center" }}>
            <p style={{ margin: 0, color: "var(--text-muted)", fontSize: "0.92rem" }}>Разбор завершён и сохранён в Историю.</p>
            <Button fullWidth onClick={onClose}>Готово</Button>
          </div>
        ) : (
          <div style={{ borderTop: "1px solid var(--border-subtle)", background: "var(--paper-050)" }}>
            {stage >= 1 && (
              <div style={{ padding: "10px 14px 0", display: "flex", justifyContent: "flex-end" }}>
                <button onClick={summarizeNow} style={{ border: "none", background: "transparent", color: "var(--text-link)", fontWeight: 700, fontSize: "0.84rem", cursor: "pointer", fontFamily: "var(--font-sans)", padding: "4px 6px" }}>Достаточно, подведи итог →</button>
              </div>
            )}
            <div style={{ padding: 14, display: "flex", gap: 10, alignItems: "flex-end" }}>
              <Input multiline rows={1} value={text} placeholder={stage === 0 ? "Опишите свой сон…" : "Ответьте или задайте свой вопрос…"} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} style={{ flex: 1, minHeight: 48 }} />
              <Button size="sm" onClick={send} style={{ minHeight: 48 }}>Отправить</Button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function todayLabel() {
  const M = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const d = new Date();
  return d.getDate() + " " + M[d.getMonth()];
}

      <span aria-hidden="true" style={{ color: "var(--cyan-300)" }}>✦</span>{msg}
    </div>
  );
}

Object.assign(window, { loadState, LS_KEY, SEED_HISTORY, Header, Tabs, BalanceCard, TariffGrid, NotebookCard, HistoryList, Toast, DreamChat });

              <img src={LOGO} alt="" style={{ width: 40, height: 40, borderRadius: '50%', objectFit: 'cover' }} />
              <span style={{ fontWeight: 700, fontSize: '1rem', color: 'var(--text-strong)' }}>Анализ снов</span>
            </div>
            {sent ? (
              <React.Fragment>
                <h2 style={{ margin: '0 0 12px', fontSize: '1.25rem', fontWeight: 700, color: 'var(--text-strong)' }}>Ссылка отправлена</h2>
                <p style={{ margin: 0, color: 'var(--text-body)', lineHeight: 1.6 }}>
                  Проверьте почту <strong>{email}</strong> — там ссылка для входа. Откройте её с этого устройства.
                </p>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <h2 style={{ margin: '0 0 8px', fontSize: '1.25rem', fontWeight: 700, color: 'var(--text-strong)' }}>Войти в кабинет</h2>
                <p style={{ margin: '0 0 24px', color: 'var(--text-muted)', lineHeight: 1.5, fontSize: '0.95rem' }}>Введите email — мы пришлём ссылку. Без пароля.</p>
                <input
                  type="email"
                  placeholder="ваш@email.com"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') sendLink(); }}
                  style={{ width: '100%', border: '1.5px solid var(--border-subtle)', borderRadius: 12, padding: '12px 14px', fontSize: '1rem', fontFamily: 'var(--font-sans)', color: 'var(--text-strong)', background: 'var(--paper-000)', outline: 'none', boxSizing: 'border-box', marginBottom: 12, display: 'block' }}
                />
                {error && <p style={{ margin: '0 0 12px', color: '#c0392b', fontSize: '0.88rem' }}>{error}</p>}
                <button
                  onClick={sendLink}
                  disabled={loading || !email.trim()}
                  style={{ width: '100%', background: 'var(--navy-800)', color: 'var(--paper-050)', border: 'none', borderRadius: 14, padding: '14px 20px', fontSize: '1rem', fontWeight: 700, cursor: (loading || !email.trim()) ? 'not-allowed' : 'pointer', opacity: (loading || !email.trim()) ? 0.5 : 1, fontFamily: 'var(--font-sans)', transition: 'opacity 0.15s' }}
                >
                  {loading ? 'Отправляем…' : 'Отправить ссылку →'}
                </button>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const initial = loadState();
      const [tab, setTab] = useState("cabinet");
      const [balance, setBalance] = useState(0);
      const [history, setHistory] = useState(SEED_HISTORY);
      const [chatOpen, setChatOpen] = useState(false);
      const [toast, setToast] = useState("");
      const [pendingDream, setPendingDream] = useState("");

      useEffect(() => {
        window._supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
          setAuthLoading(false);
        });
        const { data: { subscription } } = window._supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
          setAuthLoading(false);
          if (session?.user?.email) {
            const email = session.user.email;
            fetch('https://api.analysedreams.ru/user/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email })
            })
              .then(r => r.ok ? r.json() : null)
              .then(data => {
                if (data?.dreams_balance != null) setBalance(data.dreams_balance);
                return fetch(`https://api.analysedreams.ru/history/?email=${encodeURIComponent(email)}`);
              })
              .then(r => r.ok ? r.json() : [])
              .then(data => { if (Array.isArray(data)) setHistory(data); })
              .catch(() => {});
          }
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        try {
          const raw = localStorage.getItem('ad_landing_context');
          if (raw) {
            const { dream, ts } = JSON.parse(raw);
            if (Date.now() - ts < 600000) {
              setPendingDream(dream || "");
              setChatOpen(true);
            }
            localStorage.removeItem('ad_landing_context');
          }
        } catch (e) {}
      }, [user]);


      if (authLoading) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--bg-wash)', color: 'var(--text-muted)', fontFamily: 'var(--font-sans)' }}>
          загрузка…
        </div>
      );

      if (!user) return <LoginScreen />;

      function flash(msg) {
        setToast(msg);
        clearTimeout(window.__lkToast);
        window.__lkToast = setTimeout(() => setToast(""), 2600);
      }

      function buyTariff(t) {
        setBalance((b) => b + t.count);
        flash(`+${t.count} разборов зачислено`);
      }
      function getNotebook() {
        const a = document.createElement("a"); a.href = "/workbook_analyse_dreams.pdf"; a.download = "workbook_analyse_dreams.pdf"; a.click();
      }
      async function signOut() {
        await window._supabase.auth.signOut();
      }
      function completeAnalysis(entry) {
        setHistory((h) => [entry, ...h]);
      }
      function startAnalysis() {}
      function updateBalance(b) { setBalance(b); }
      function goTopUp() {
        setChatOpen(false);
        setTab("cabinet");
        flash("Выберите пакет разборов");
      }

      return (
        <React.Fragment>
          <div data-screen-label="Личный кабинет">
            <Header email={user.email} onSignOut={signOut} />
            <Tabs value={tab} onChange={setTab} />
            {tab === "cabinet" ? (
              <div className="lk-stack">
                <BalanceCard balance={balance} onAnalyze={() => setChatOpen(true)} />
                <TariffGrid onBuy={buyTariff} />
                <NotebookCard onGet={getNotebook} />
              </div>
            ) : (
              <HistoryList items={history} />
            )}
          </div>
          <DreamChat open={chatOpen} balance={balance} onClose={() => setChatOpen(false)} onStart={startAnalysis} onComplete={completeAnalysis} onGoTopUp={goTopUp} onBalanceUpdate={updateBalance} initialDream={pendingDream} email={user.email} />
          <Toast msg={toast} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>


</body></html>
