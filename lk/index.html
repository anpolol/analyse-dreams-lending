/* ============================================================
   AnalyseDreams — Color tokens
   Deep navy ink on a cyan-tinted paper, with a cream/ivory
   "emblem" tone and luminous cyan starlight accents.
   ============================================================ */

:root {
  /* ---- Dark dream palette (инверсия светлой темы, как в лендинге) ---- */
  --bg:         #10172e;   /* app background, deep night            */
  --bg-soft:    #161d36;   /* raised cards / inputs / bot bubble    */
  --bg-accent:  #212c4e;   /* soft fill, chips, recessed panels     */
  --bg-deep:    #0a0f1f;

  /* ---- Brand ink (deep plum, dreamcore) — тёмные поверхности ---- */
  --navy-900: #050810;   /* deepest — night sky / overlays         */
  --navy-800: #172236;   /* night panels, locked cards, badges     */
  --navy-700: #1e2d44;
  --navy-600: #28425f;
  --navy-500: #3a546f;

  /* ---- Paper scale: в тёмной теме это светлые поверхности-текст ---- */
  --paper-000: #161d36;  /* raised card / input background (тёмная)*/
  --paper-050: #f9ffff;  /* LIGHT — inverse text на тёмных поверхн. */
  --paper-100: #212c4e;  /* soft section fill (тёмная)             */
  --paper-200: #212c4e;
  --paper-300: #2a375e;  /* accent fill / chips (тёмная)           */

  /* ---- Cream / ivory (logo + warm imagery) ------------------- */
  --cream-100: #f4eede;
  --cream-200: #ece4d4;  /* emblem background                   */
  --cream-300: #e0d4bd;

  /* ---- Starlight lavender (decorative accent) ---------------- */
  --cyan-100: rgba(143,214,232,0.22); /* hover glass on dark         */
  --cyan-200: #d8f4fb;   /* sparkle glow                        */
  --cyan-300: #a3e0ef;   /* primary lavender accent (ярче)      */
  --cyan-400: #6cc6dc;
  --cyan-500: #3fa8c4;

  /* ---- Purple lavender (сирень + свечения, как на лендинге) ---- */
  --lavender:       #a88cdc;   /* rgba(168,140,220) — сиреневый     */
  --lavender-soft:  #c4b0e8;
  --lavender-deep:  #8a6ec8;
  --lavender-100:   rgba(168,140,220,0.22);
  --lavender-200:   rgba(168,140,220,0.32);
  --lavender-glow:  0 0 60px rgba(168,140,220,0.35), 0 0 24px rgba(143,214,232,0.18), 0 18px 44px rgba(0,0,0,0.4);
  --lavender-grad:  linear-gradient(135deg, rgba(168,140,220,0.28) 0%, rgba(143,214,232,0.18) 100%);
  --lavender-orb:   radial-gradient(circle at 34% 34%, #fbf8ff 0%, #ece0fa 58%, #b8a4e0 100%);

  /* ---- Dusk peach (from imagery, supporting) ----------------- */
  --dusk-200: #d7dfef;
  --dusk-300: #b9c6e2;
  --dusk-400: #8093bd;

  /* ---- Functional ------------------------------------------- */
  --success-500: #4ec39b;
  --warning-500: #e0b24c;
  --danger-500:  #e06a7e;

  /* ============================================================
     Semantic aliases — prefer these in components
     ============================================================ */

  /* Text */
  --text-strong:  #f9ffff;
  --text-body:    #c8d6ec;
  --text-muted:   rgba(249, 255, 255, 0.66);
  --text-faint:   rgba(249, 255, 255, 0.42);
  --text-inverse: var(--navy-800);   /* текст на светлой кнопке    */
  --text-link:    var(--lavender-soft);

  /* Surfaces */
  --surface-app:     var(--bg);
  --surface-soft:    var(--bg-accent);
  --surface-card:    rgba(255, 255, 255, 0.05);
  --surface-raised:  var(--bg-soft);
  --surface-accent:  var(--paper-300);
  --surface-night:   var(--navy-800);

  /* Borders */
  --border-subtle:  rgba(249, 255, 255, 0.16);
  --border-strong:  rgba(249, 255, 255, 0.28);
  --border-onnight: rgba(249, 255, 255, 0.56);

  /* Accent / interactive (белая основная кнопка) */
  --accent:          #f9ffff;
  --accent-contrast: var(--navy-800);
  --accent-glow:     var(--lavender);

  /* Overlay scrims used on full-bleed imagery */
  --scrim-soft: linear-gradient(180deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.42) 100%); /* @kind color */
  --scrim-deep: linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.60) 100%); /* @kind color */

  /* Signature page background wash */
  --bg-wash: var(--bg); /* @kind color */
  --bg-wash-layers:
    radial-gradient(900px 620px at 85% -5%, rgba(92,188,212,0.22), transparent 62%),
    radial-gradient(820px 560px at -10% 12%, rgba(143,214,232,0.18), transparent 60%),
    radial-gradient(700px 520px at 50% 110%, rgba(174,191,227,0.20), transparent 60%),
    linear-gradient(180deg, #0c1228 0%, #10172e 45%, #0c1226 100%); /* @kind other */
}

/* ============================================================
   AnalyseDreams — Typography tokens
   Single family: Manrope. Tight, low line-height display
   headings (letter-spacing -0.02em, line-height ~0.95) over
   calm, readable body. Russian-first, Latin-ready.
   ============================================================ */

:root {
  /* Families */
  --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Manrope", system-ui, sans-serif;

  /* Weights */
  --weight-regular: 400;
  --weight-medium:  500;
  --weight-semibold: 600;
  --weight-bold:    700;
  --weight-black:   800;

  /* Fluid display sizes (hero / section headers) */
  --display-2xl: clamp(2.7rem, 4.5vw, 4.55rem); /* @kind font */
  --display-xl:  clamp(1.8rem, 3.4vw, 3.6rem);  /* @kind font */
  --display-lg:  clamp(1.6rem, 2.6vw, 2.5rem);  /* @kind font */
  --display-md:  clamp(1.45rem, 2vw, 1.95rem);  /* @kind font */

  /* Static text sizes */
  --text-3xl: 2rem;
  --text-2xl: 1.5rem;
  --text-xl:  1.3rem;
  --text-lg:  1.125rem;
  --text-md:  1rem;       /* base body                          */
  --text-sm:  0.92rem;
  --text-xs:  0.82rem;
  --text-2xs: 0.72rem;    /* eyebrow / kicker                   */

  /* Line heights */
  --leading-display: 0.95;  /* tight display                    */
  --leading-snug:    1.15;
  --leading-body:    1.5;
  --leading-relaxed: 1.62;

  /* Letter spacing */
  --tracking-display: -0.02em;
  --tracking-tight:   -0.01em;
  --tracking-normal:  0;
  --tracking-eyebrow: 0.12em;  /* uppercase eyebrow             */

  /* Semantic roles */
  --type-eyebrow-size:   var(--text-2xs);
  --type-eyebrow-weight: var(--weight-black);
  --type-body-size:      var(--text-md);
  --type-body-weight:    var(--weight-regular);
}

/* Optional helper classes (components prefer the vars directly) */
.ad-eyebrow {
  margin: 0;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: var(--type-eyebrow-size);
  font-weight: var(--type-eyebrow-weight);
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
}

.ad-display {
  margin: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-black);
  line-height: var(--leading-display);
  letter-spacing: var(--tracking-display);
  color: var(--text-strong);
}

/* ============================================================
   AnalyseDreams — Spacing, radii, shadows, layout
   Generous, airy rhythm. Large soft radii (14–30px) and
   diffuse, low-opacity navy shadows. No hard borders on cards.
   ============================================================ */

:root {
  /* Spacing scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-28: 112px;     /* between major sections             */

  /* Radii */
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-2xl: 30px;
  --radius-pill: 999px;

  /* Shadows — diffuse, deep on dark, no spread */
  --shadow-xs: 0 2px 8px rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 10px 24px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 18px 40px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 22px 60px rgba(0, 0, 0, 0.45);
  --shadow-xl: 0 32px 70px rgba(0, 0, 0, 0.55);   /* on imagery */
  --shadow-glow: 0 0 32px rgba(143, 214, 232, 0.55); /* cyan    */

  /* Buttons */
  --button-height: 56px;
  --button-pad-x: 24px;
  --button-radius: var(--radius-lg);

  /* Layout */
  --container: 1344px;
  --container-narrow: 720px;
  --gutter: 32px;

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */
  --dur-fast: 160ms; /* @kind other */
  --dur-base: 240ms; /* @kind other */
  --dur-slow: 420ms; /* @kind other */
}

  body { margin: 0; background: var(--bg-wash-layers), var(--bg-wash); background-attachment: fixed; min-height: 100vh; font-family: var(--font-sans); color: var(--text-strong); overflow-x: hidden; }
  /* Drifting dream-mist layers (как в лендинге) */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%;

  }
  body::before {
    width: 44vw; height: 44vw; left: -12vw; top: 16vh;
    background: radial-gradient(circle, rgba(186,234,245,0.24), transparent 70%);
    animation: lk-mist-drift 26s ease-in-out infinite alternate;
  }
  body::after {
    width: 38vw; height: 38vw; right: -10vw; top: 55vh;
    background: radial-gradient(circle, rgba(204,235,240,0.20), transparent 70%);
    animation: lk-mist-drift 32s ease-in-out infinite alternate-reverse;
  }
  @keyframes lk-mist-drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(6vw,-4vh,0) scale(1.08); }
  }
  @keyframes lk-twinkle {
    0%   { opacity: 0.25; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1.15); }
  }
  #root { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 80px; }
  .lk-stack { display: flex; flex-direction: column; gap: 40px; }

  .md-content { font-size: inherit; line-height: 1.5; }
