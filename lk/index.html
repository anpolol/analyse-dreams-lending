/* ============================================================
   AnalyseDreams — Color tokens
   Deep navy ink on a cyan-tinted paper, with a cream/ivory
   "emblem" tone and luminous cyan starlight accents.
   ============================================================ */

:root {
  /* ---- Brand navy (ink) scale -------------------------------- */
  --navy-900: #0f1a2e;   /* deepest — overlays, night sky      */
  --navy-800: #172236;   /* PRIMARY brand ink / emblem circle   */
  --navy-700: #1e2d44;
  --navy-600: #28425f;   /* secondary ink, links on light       */
  --navy-500: #3a546f;

  /* ---- Paper / surface scale (cyan-tinted whites) ------------ */
  --paper-000: #ffffff;
  --paper-050: #f9ffff;  /* app background                      */
  --paper-100: #eef8fb;  /* soft section fill                   */
  --paper-200: #ddf0f5;
  --paper-300: #ccebf0;  /* accent fill / chips                 */

  /* ---- Cream / ivory (logo + warm imagery) ------------------- */
  --cream-100: #f4eede;
  --cream-200: #ece4d4;  /* emblem background                   */
  --cream-300: #e0d4bd;

  /* ---- Starlight cyan (decorative accent) -------------------- */
  --cyan-100: #e6f8fd;
  --cyan-200: #d8f4fb;   /* sparkle glow                        */
  --cyan-300: #bfe9f4;   /* primary cyan accent                 */
  --cyan-400: #8fd6e8;   /* deeper cyan                         */
  --cyan-500: #5cbcd4;

  /* ---- Dusk lavender (from imagery, supporting) ------------- */
  --dusk-200: #d7dfef;
  --dusk-300: #b9c6e2;
  --dusk-400: #8093bd;

  /* ---- Functional ------------------------------------------- */
  --success-500: #3f9d7a;
  --warning-500: #d8a23c;
  --danger-500:  #c2566b;

  /* ============================================================
     Semantic aliases — prefer these in components
     ============================================================ */

  /* Text */
  --text-strong:  var(--navy-800);
  --text-body:    var(--navy-700);
  --text-muted:   rgba(23, 34, 54, 0.64);
  --text-faint:   rgba(23, 34, 54, 0.42);
  --text-inverse: var(--paper-050);
  --text-link:    var(--navy-600);

  /* Surfaces */
  --surface-app:     var(--paper-050);
  --surface-soft:    var(--paper-100);
  --surface-card:    rgba(255, 255, 255, 0.82);
  --surface-raised:  var(--paper-000);
  --surface-accent:  var(--paper-300);
  --surface-night:   var(--navy-800);

  /* Borders */
  --border-subtle:  rgba(23, 34, 54, 0.12);
  --border-strong:  rgba(23, 34, 54, 0.22);
  --border-onnight: rgba(249, 255, 255, 0.56);

  /* Accent / interactive */
  --accent:          var(--navy-800);
  --accent-contrast: var(--paper-050);
  --accent-glow:     var(--cyan-300);

  /* Overlay scrims used on full-bleed imagery */
  --scrim-soft: linear-gradient(180deg, rgba(15,26,46,0.10) 0%, rgba(11,20,38,0.34) 100%); /* @kind color */
  --scrim-deep: linear-gradient(180deg, rgba(17,24,45,0.04) 0%, rgba(17,24,45,0.52) 100%); /* @kind color */

  /* Signature page background wash */
  --bg-wash:
    radial-gradient(1100px 720px at 6% -6%, rgba(143,214,232,0.9), transparent 56%),
    radial-gradient(900px 640px at 102% 2%, rgba(23,34,54,0.26), transparent 58%),
    radial-gradient(820px 600px at 46% 112%, rgba(92,188,212,0.4), transparent 60%),
    linear-gradient(180deg, #d8eff6 0%, #eefafc 26%, #f9ffff 100%),
    var(--paper-050); /* @kind color */
}

/* ============================================================
   AnalyseDreams — Typography tokens
   Single family: Manrope. Tight, low line-height display
   headings (letter-spacing -0.02em, line-height ~0.95) over
   calm, readable body. Russian-first, Latin-ready.
   ============================================================ */

:root {
  /* Families */
  --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Manrope", system-ui, sans-serif;

  /* Weights */
  --weight-regular: 400;
  --weight-medium:  500;
  --weight-semibold: 600;
  --weight-bold:    700;
  --weight-black:   800;

  /* Fluid display sizes (hero / section headers) */
  --display-2xl: clamp(2.7rem, 4.5vw, 4.55rem); /* @kind font */
  --display-xl:  clamp(1.8rem, 3.4vw, 3.6rem);  /* @kind font */
  --display-lg:  clamp(1.6rem, 2.6vw, 2.5rem);  /* @kind font */
  --display-md:  clamp(1.45rem, 2vw, 1.95rem);  /* @kind font */

  /* Static text sizes */
  --text-3xl: 2rem;
  --text-2xl: 1.5rem;
  --text-xl:  1.3rem;
  --text-lg:  1.125rem;
  --text-md:  1rem;       /* base body                          */
  --text-sm:  0.92rem;
  --text-xs:  0.82rem;
  --text-2xs: 0.72rem;    /* eyebrow / kicker                   */

  /* Line heights */
  --leading-display: 0.95;  /* tight display                    */
  --leading-snug:    1.15;
  --leading-body:    1.5;
  --leading-relaxed: 1.62;

  /* Letter spacing */
  --tracking-display: -0.02em;
  --tracking-tight:   -0.01em;
  --tracking-normal:  0;
  --tracking-eyebrow: 0.12em;  /* uppercase eyebrow             */

  /* Semantic roles */
  --type-eyebrow-size:   var(--text-2xs);
  --type-eyebrow-weight: var(--weight-black);
  --type-body-size:      var(--text-md);
  --type-body-weight:    var(--weight-regular);
}

/* Optional helper classes (components prefer the vars directly) */
.ad-eyebrow {
  margin: 0;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: var(--type-eyebrow-size);
  font-weight: var(--type-eyebrow-weight);
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
}

.ad-display {
  margin: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-black);
  line-height: var(--leading-display);
  letter-spacing: var(--tracking-display);
  color: var(--text-strong);
}

/* ============================================================
   AnalyseDreams — Spacing, radii, shadows, layout
   Generous, airy rhythm. Large soft radii (14–30px) and
   diffuse, low-opacity navy shadows. No hard borders on cards.
   ============================================================ */

:root {
  /* Spacing scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-28: 112px;     /* between major sections             */

  /* Radii */
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-2xl: 30px;
  --radius-pill: 999px;

  /* Shadows — diffuse, navy-tinted, no spread */
  --shadow-xs: 0 2px 8px rgba(23, 34, 54, 0.06);
  --shadow-sm: 0 10px 24px rgba(23, 34, 54, 0.08);
  --shadow-md: 0 18px 40px rgba(23, 34, 54, 0.12);
  --shadow-lg: 0 22px 60px rgba(23, 34, 54, 0.12);
  --shadow-xl: 0 32px 70px rgba(0, 0, 0, 0.28);   /* on imagery */
  --shadow-glow: 0 0 32px rgba(191, 233, 244, 0.55); /* cyan    */

  /* Buttons */
  --button-height: 56px;
  --button-pad-x: 24px;
  --button-radius: var(--radius-lg);

  /* Layout */
  --container: 1344px;
  --container-narrow: 720px;
  --gutter: 32px;

  /* Motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */
  --dur-fast: 160ms; /* @kind other */
  --dur-base: 240ms; /* @kind other */
  --dur-slow: 420ms; /* @kind other */
}

  <script type="text/babel">/* global React, DesignSystem_041ca9 */
// Личный кабинет «Анализ снов» — sections & guided dream-dialogue.
const { Button, GhostButton, Eyebrow, Badge, Card, Input, Sparkle } = window.DesignSystem_041ca9;
const { useState, useEffect, useLayoutEffect, useRef } = React;

const IMG = "..";
const DECOR = "..";
const LS_KEY = "ad_lk_state_v1";

const TARIFFS = [];

const SEED_HISTORY = [];

function loadState() {
  return {};
}

// Prefer inlined data-URI assets (for offline/standalone), fall back to file paths.
function assetUrl(key, fallback) {
  return (typeof window !== "undefined" && window.AD_ASSETS && window.AD_ASSETS[key]) || fallback;
}
const LOGO = assetUrl("logo", "/logo.jpeg");

function DecorImg({ k, size, opacity = 0.9, style = {} }) {
  const keyMap = { "dotted-l": "starL", "dotted-m": "starM", "dotted-s": "starS", "sparkle": "sparkle" };
  const fbMap = { "dotted-l": DECOR + "/Str Union_L.PNG", "dotted-m": DECOR + "/Str Union_m.PNG", "dotted-s": DECOR + "/Str Union_s.PNG", "sparkle": DECOR + "/Vector_star.PNG" };
  return <img src={assetUrl(keyMap[k], fbMap[k])} alt="" aria-hidden="true" style={{ display: "block", width: size, height: "auto", opacity, pointerEvents: "none", ...style }} />;
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

/* ---------- Header ---------- */
function Header({ email, onSignOut }) {
  return (
    <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14, marginBottom: 30 }}>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 11, fontWeight: 700, fontSize: "1.1rem", color: "var(--text-strong)" }}>
        <img src={LOGO} alt="" style={{ width: 34, height: 34, borderRadius: 999, objectFit: "cover" }} />
        Анализ снов
      </span>
      <div style={{ display: "inline-flex", alignItems: "center", gap: 10 }}>
        <span style={{ display: "inline-flex", alignItems: "center", padding: "8px 14px", borderRadius: 999, background: "var(--surface-card)", border: "1px solid var(--border-subtle)", fontSize: "0.9rem", color: "var(--text-body)", fontWeight: 600 }}>
          {email}
        </span>
        <GhostButton size="sm" onClick={onSignOut}>Выйти</GhostButton>
      </div>
    </header>
  );
}

/* ---------- Tabs ---------- */
function Tabs({ value, onChange }) {
  const items = [
    { id: "cabinet", label: "Кабинет" },
    { id: "archetypes", label: "Созвездие архетипов" },
    { id: "history", label: "История" },
  ];
  return (
    <div style={{ display: "inline-flex", gap: 4, padding: 4, borderRadius: 999, background: "var(--surface-card)", border: "1px solid var(--border-subtle)", marginBottom: 28 }}>
      {items.map((it) => {
        const active = value === it.id;
        return (
          <button
            key={it.id}
            onClick={() => onChange(it.id)}
            style={{
              border: "none", cursor: "pointer", padding: "10px 22px", borderRadius: 999,
              fontFamily: "var(--font-sans)", fontWeight: 700, fontSize: "0.95rem",
              transition: "all 160ms var(--ease-out)",
              background: active ? "var(--navy-800)" : "transparent",
              color: active ? "var(--paper-050)" : "var(--text-muted)",
              boxShadow: active ? "var(--shadow-sm)" : "none",
            }}
          >
            {it.label}
          </button>
        );
      })}
    </div>
  );
}

/* ---------- Archetypes / Constellation ---------- */
// Small fixed dots scattered inside a locked card to sell the "night sky" veil look.
const VEIL_DOTS = [
  { left: "14%", top: "20%" }, { right: "16%", top: "30%" },
  { right: "20%", bottom: "18%" }, { left: "22%", bottom: "14%" },
];

// The card itself — image area + name + (locked) description — all sitting on one
// solid backing panel, so it reads as a distinct tile even when the constellation
// scatters cards close together.
const CARD_W = 200;

function ArchetypeCard({ symbol, onSelect, cardRef }) {
  const [hover, setHover] = useState(false);
  const locked = !symbol.is_revealed;
  return (
    <div
      ref={cardRef}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        boxSizing: "border-box", width: CARD_W, display: "flex", flexDirection: "column", gap: 10,
        padding: 14, borderRadius: "var(--radius-xl)",
        background: locked ? "var(--navy-800)" : "var(--paper-000)",
        border: locked ? "1.5px dashed rgba(249,255,255,0.32)" : "1px solid var(--border-subtle)",
        boxShadow: hover ? "var(--shadow-xl)" : "var(--shadow-lg)",
        transform: hover ? "translateY(-5px) scale(1.03)" : "none",
        transition: "transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out)",
        cursor: "pointer",
      }}
    >
      <button
        onClick={() => onSelect(symbol.id)}
        title={symbol.name}
        style={{
          position: "relative", width: "100%", height: 150, padding: 0, overflow: "hidden",
          borderRadius: "var(--radius-md)", cursor: "pointer", border: "none",
          background: locked ? "rgba(249,255,255,0.06)" : "var(--paper-050)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}
      >
        {locked ? (
          <React.Fragment>
            {VEIL_DOTS.map((d, i) => (
              <span key={i} style={{ position: "absolute", ...d, width: 3, height: 3, borderRadius: 999, background: "rgba(249,255,255,0.4)" }} />
            ))}
            <span style={{ color: "var(--cyan-300)", fontSize: "1.7rem" }}>✦</span>
          </React.Fragment>
        ) : symbol.image_url ? (
          <img src={symbol.image_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
        ) : (
          <span style={{ color: "var(--navy-800)", fontSize: "1.7rem" }}>✦</span>
        )}
      </button>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8, minWidth: 0 }}>
        <p style={{ margin: 0, flex: 1, minWidth: 0, fontWeight: 800, fontSize: "1rem", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", color: locked ? "rgba(249,255,255,0.95)" : "var(--text-strong)" }}>{symbol.name}</p>
        {!locked && symbol.dreams.length > 0 && (
          <span style={{
            flexShrink: 0, display: "inline-flex", alignItems: "center", gap: 4,
            fontSize: "0.78rem", fontWeight: 700, color: "var(--navy-800)", background: "var(--cyan-300)",
            borderRadius: 999, padding: "3px 9px",
          }}>
            ✦ {symbol.dreams.length}
          </span>
        )}
      </div>
      {locked && (

// Deterministic pseudo-random in [0, 1) — same seed always gives the same value,
// so the scatter doesn't jump around on every re-render.
function pseudoRandom(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

// Places cards on a loose grid, then nudges each one within its cell by an amount
// small enough that neighbouring cards never collide — looks scattered, stays readable.
function scatterPositions(count) {
  const CELL_W = 300, CELL_H = 380, PADDING = 50, JITTER = 22;
  const columns = Math.max(2, Math.ceil(Math.sqrt(count * 1.4)));
  const rows = Math.ceil(count / columns);
  const positions = Array.from({ length: count }).map((_, i) => {
    const col = i % columns;
    const row = Math.floor(i / columns);
    const baseX = PADDING + col * CELL_W + CELL_W / 2;
    const baseY = PADDING + row * CELL_H + CELL_H / 2;
    const jitterX = (pseudoRandom(i * 2 + 1) - 0.5) * 2 * JITTER;
    const jitterY = (pseudoRandom(i * 2 + 2) - 0.5) * 2 * JITTER;
    return { x: baseX + jitterX, y: baseY + jitterY };
  });
  return { positions, width: columns * CELL_W + PADDING * 2, height: rows * CELL_H + PADDING * 2 };
}

function ConstellationGraph({ symbols, connections, onSelect }) {
  const scrollRef = useRef(null);
  const containerRef = useRef(null);
  const cardRefs = useRef({});
  const [lines, setLines] = useState([]);
  const [grabbing, setGrabbing] = useState(false);
  const drag = useRef({ active: false, moved: false, startX: 0, startY: 0, scrollLeft: 0, scrollTop: 0 });

  const { positions, width, height } = scatterPositions(symbols.length + 1);
  const mysteryPos = positions[symbols.length];

  useLayoutEffect(() => {
    function measure() {
      const containerEl = containerRef.current;
      if (!containerEl) return;
      const containerRect = containerEl.getBoundingClientRect();
      const centers = {};
      Object.keys(cardRefs.current).forEach((id) => {
        const el = cardRefs.current[id];
        if (!el) return;
        const r = el.getBoundingClientRect();
        centers[id] = { x: r.left + r.width / 2 - containerRect.left, y: r.top + r.height / 2 - containerRect.top };
      });
      setLines(connections.map((c) => {
        const a = centers[c.a], b = centers[c.b];
        return a && b ? { x1: a.x, y1: a.y, x2: b.x, y2: b.y, strength: c.strength } : null;
      }).filter(Boolean));
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [symbols, connections]);

  // Drag-to-pan the sky — grab anywhere (including on a card) and slide to
  // reveal archetypes scattered further out. A small movement threshold keeps
  // plain taps/clicks on cards working as before.
  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const el = scrollRef.current;
    if (!el) return;
    drag.current = { active: true, moved: false, startX: e.clientX, startY: e.clientY, scrollLeft: el.scrollLeft, scrollTop: el.scrollTop };
    setGrabbing(true);
  }
  function onPointerMove(e) {
    const d = drag.current;
    if (!d.active) return;
    const el = scrollRef.current;
    const dx = e.clientX - d.startX, dy = e.clientY - d.startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) d.moved = true;
    if (d.moved) {
      el.scrollLeft = d.scrollLeft - dx;
      el.scrollTop = d.scrollTop - dy;
    }
  }
  function onPointerUp() {
    drag.current.active = false;
    setGrabbing(false);
  }
  function onClickCapture(e) {
    if (drag.current.moved) {
      e.preventDefault();
      e.stopPropagation();
      drag.current.moved = false;
    }
  }

  return (
    <div
      ref={scrollRef}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerLeave={onPointerUp}
      onClickCapture={onClickCapture}
      style={{
        width: "100vw", marginLeft: "calc(50% - 50vw)", marginRight: "calc(50% - 50vw)", marginBottom: -80,
        borderRadius: 0, overflow: "auto", touchAction: "none", userSelect: "none",
        cursor: grabbing ? "grabbing" : "grab",
        background: "radial-gradient(circle at 30% 20%, rgba(143,214,232,0.18), transparent 55%), linear-gradient(160deg, var(--navy-900), var(--navy-800))",
        boxShadow: "var(--shadow-xl)", padding: 8,
      }}
    >
      <div ref={containerRef} style={{ position: "relative", width, minHeight: height, margin: "0 auto" }}>
        <DecorImg k="dotted-s" size={20} opacity={0.4} style={{ position: "absolute", left: "4%", top: "8%" }} />
        <DecorImg k="dotted-s" size={16} opacity={0.3} style={{ position: "absolute", right: "5%", bottom: "10%" }} />
        <svg style={{ position: "absolute", inset: 0, width: "100%", height: "100%", pointerEvents: "none" }}>
          {lines.map((l, i) => (
            <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="rgba(143,214,232,0.5)" strokeWidth={Math.min(1 + l.strength * 0.6, 4)} />
          ))}
        </svg>
        {symbols.map((s, i) => (
          <div key={s.id} style={{ position: "absolute", left: positions[i].x, top: positions[i].y, transform: "translate(-50%, -50%)" }}>
            <ArchetypeCard symbol={s} onSelect={onSelect} cardRef={(el) => { cardRefs.current[s.id] = el; }} />
          </div>
        ))}
        <div style={{ position: "absolute", left: mysteryPos.x, top: mysteryPos.y, transform: "translate(-50%, -50%)" }}>
          <MysteryArchetypeCard />
        </div>
      </div>
    </div>
  );
}

/* ---------- Dream dialogue engine ---------- */
const API_BASE = 'https://api.analysedreams.ru';

async function authHeaders(token) {
  if (!token) {
    const { data: { session } } = await window._supabase.auth.getSession();
    token = session?.access_token;
  }
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}

async function callAnalyse(apiMsgs, isEnded) {
  const res = await fetch(`${API_BASE}/analyse/run`, {
    method: 'POST',
    headers: await authHeaders(),
    body: JSON.stringify({ dream_title: '', is_ended: isEnded, messages: apiMsgs }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw Object.assign(new Error(body.detail || `HTTP ${res.status}`), { status: res.status });
  }
  return res.json();
}

function Bubble({ from, children }) {
  const isBot = from === "bot";
  return (
    <div style={{ display: "flex", justifyContent: isBot ? "flex-start" : "flex-end" }}>
      <div style={{ maxWidth: "84%", padding: "12px 16px", borderRadius: isBot ? "6px 18px 18px 18px" : "18px 6px 18px 18px", background: isBot ? "var(--paper-000)" : "var(--navy-800)", color: isBot ? "var(--text-body)" : "var(--paper-050)", boxShadow: "var(--shadow-sm)", fontSize: "0.95rem", lineHeight: 1.45 }}>
        {children}
      </div>
    </div>
  );
}

function MarkdownText({ text }) {
  const html = DOMPurify.sanitize(marked.parse(text || ""));
  return <div className="md-content" dangerouslySetInnerHTML={{ __html: html }} />;
}

function InsightBubble({ text }) {
  return (
    <div style={{ background: "var(--navy-800)", color: "var(--paper-050)", borderRadius: "6px 18px 18px 18px", padding: "16px 18px", boxShadow: "var(--shadow-md)" }}>
      <p style={{ margin: "0 0 8px", fontSize: "0.74rem", fontWeight: 800, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--cyan-300)", display: "flex", alignItems: "center", gap: 8 }}>
        <span aria-hidden="true">✦</span>Инсайт
      </p>
      <MarkdownText text={text} />
    </div>
  );
}

// Depth indicator — dots fill as the dialogue moves toward the insight.
function DepthMeter({ stage }) {
  const total = 4;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <div style={{ display: "flex", gap: 5 }}>
        {Array.from({ length: total }).map((_, i) => (
          <span key={i} style={{ width: 7, height: 7, borderRadius: 999, background: i < stage ? "var(--cyan-300)" : "rgba(249,255,255,0.25)", transition: "background 240ms var(--ease-out)" }}></span>
        ))}
      </div>
      <span style={{ fontSize: "0.78rem", color: "rgba(249,255,255,0.7)" }}>{stage >= total ? "инсайт найден" : "путь к инсайту"}</span>
    </div>
  );
}

function DreamChat({ open, balance, onClose, onStart, onComplete, onGoTopUp, onBalanceUpdate, initialDream, email }) {
  const greeting = { from: "bot", node: <span>Привет! Расскажите свой сон в нескольких предложениях — а дальше мы разберём его в диалоге: я буду задавать вопросы, вы можете отвечать или спрашивать в ответ, пока не придём к инсайту.</span> };
  const [msgs, setMsgs] = useState([greeting]);
  const [apiMsgs, setApiMsgs] = useState([]);
  const [text, setText] = useState("");
  const [typing, setTyping] = useState(false);
  const [stage, setStage] = useState(0);
  const [done, setDone] = useState(false);
  const [entry, setEntry] = useState(null);
  const [errMsg, setErrMsg] = useState("");
  const scroller = useRef(null);

  useEffect(() => {
    if (open) { setMsgs([greeting]); setText(initialDream || ""); setTyping(false); setStage(0); setDone(false); setEntry(null); setApiMsgs([]); setErrMsg(""); }
  }, [open]);

  useEffect(() => { if (scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight; }, [msgs, typing]);

  if (!open) return null;
  const noBalance = balance <= 0 && stage === 0;

  async function runTurn(newApiMsgs, isEnded) {
    setTyping(true);
    try {
      const data = await callAnalyse(newApiMsgs, isEnded);
      setTyping(false);
      const result = data.result;
      let botText = result.messages[result.messages.length - 1].content;
      try { const p = JSON.parse(botText); if (p.insight) botText = p.insight; } catch (e) {}
      setApiMsgs([...newApiMsgs, { role: 'assistant', content: botText }]);

      const isInsight = isEnded || newApiMsgs.length >= 7;
      if (isInsight) {
        setMsgs((m) => [...m, { from: "bot", node: <InsightBubble text={botText} /> }]);
        setStage(4);
        setDone(true);
        onComplete({ ...(entry || {}), title: result.dream_title || todayLabel(), insight: botText });
        if (onBalanceUpdate) onBalanceUpdate(data.dreams_balance);
      } else {
        setMsgs((m) => [...m, { from: "bot", node: <MarkdownText text={botText} /> }]);
        setStage((s) => s + 1);
      }
    } catch (err) {
      setTyping(false);
      console.error("analyse/run error:", err);
      if (err.status === 402) onGoTopUp();
      else setErrMsg(err.message || "Ошибка соединения с сервером. Попробуйте ещё раз.");
    }
  }

  function send() {
    const value = text.trim();
    if (!value || typing || done) return;
    if (stage === 0 && balance <= 0) return;

    const newApiMsgs = [...apiMsgs, { role: 'user', content: value }];
    setApiMsgs(newApiMsgs);
    setMsgs((m) => [...m, { from: "me", node: <span>{value}</span> }]);
    setText("");

    if (stage === 0) {
      onStart();
      setEntry({ id: Date.now(), date: todayLabel(), dream: value });
    }

    runTurn(newApiMsgs, false);
  }

  function summarizeNow() {
    if (typing || done || stage === 0) return;
    runTurn(apiMsgs, true);
  }

  const hasSent = msgs.some(m => m.from === "me");

  return (
    <div onClick={hasSent ? undefined : onClose} style={{ position: "fixed", inset: 0, zIndex: 70, background: "rgba(11,20,38,0.62)", backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(480px, 100%)", height: "min(700px, 92vh)", background: "var(--surface-soft)", borderRadius: 28, overflow: "hidden", boxShadow: "var(--shadow-xl)", display: "flex", flexDirection: "column" }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 18px", background: "var(--navy-800)", color: "#f9ffff" }}>
          <img src={LOGO} alt="" style={{ width: 40, height: 40, borderRadius: 999, objectFit: "cover" }} />
          <div style={{ flex: 1 }}>
            <p style={{ margin: 0, fontWeight: 700 }}>Разбор сна</p>
            {stage === 0
              ? <p style={{ margin: 0, fontSize: "0.8rem", color: "rgba(249,255,255,0.7)" }}>В балансе: {balance} {plural(balance, "разбор", "разбора", "разборов")}</p>
              : <DepthMeter stage={stage} />}
          </div>
          {!hasSent && (
            <button onClick={onClose} aria-label="Закрыть" style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#f9ffff", width: 32, height: 32, borderRadius: 999, cursor: "pointer", fontSize: 18, lineHeight: 1 }}>×</button>
          )}
        </div>

        {/* Messages */}
        <div ref={scroller} style={{ flex: 1, overflowY: "auto", padding: 18, display: "flex", flexDirection: "column", gap: 12 }}>
          {msgs.map((m, i) => <Bubble key={i} from={m.from}>{m.node}</Bubble>)}
          {typing && <Bubble from="bot"><span style={{ color: "var(--text-muted)" }}>печатает…</span></Bubble>}
          {errMsg && (
            <div style={{ padding: "10px 14px", borderRadius: 12, background: "rgba(194,86,107,0.10)", border: "1px solid rgba(194,86,107,0.3)", color: "var(--danger-500)", fontSize: "0.86rem", lineHeight: 1.4 }}>⚠ {errMsg}</div>
          )}

        </div>

        {/* Composer / states */}
        {noBalance ? (
          <div style={{ padding: 18, borderTop: "1px solid var(--border-subtle)", background: "var(--paper-050)", display: "flex", flexDirection: "column", gap: 10, alignItems: "center", textAlign: "center" }}>
            <p style={{ margin: 0, color: "var(--text-muted)", fontSize: "0.92rem" }}>Разборы закончились. Пополните баланс, чтобы начать беседу.</p>
            <Button fullWidth onClick={onGoTopUp}>Пополнить баланс</Button>
          </div>
        ) : done ? (
          <div style={{ padding: 18, borderTop: "1px solid var(--border-subtle)", background: "var(--paper-050)", display: "flex", flexDirection: "column", gap: 8, alignItems: "center", textAlign: "center" }}>
            <p style={{ margin: 0, color: "var(--text-muted)", fontSize: "0.92rem" }}>Разбор завершён и сохранён в Историю.</p>
            <Button fullWidth onClick={onClose}>Готово</Button>
          </div>
        ) : (
          <div style={{ borderTop: "1px solid var(--border-subtle)", background: "var(--paper-050)" }}>
            {stage >= 1 && (
              <div style={{ padding: "10px 14px 0", display: "flex", justifyContent: "flex-end" }}>
                <button onClick={summarizeNow} style={{ border: "none", background: "transparent", color: "var(--text-link)", fontWeight: 700, fontSize: "0.84rem", cursor: "pointer", fontFamily: "var(--font-sans)", padding: "4px 6px" }}>Достаточно, подведи итог →</button>
              </div>
            )}
            <div style={{ padding: 14, display: "flex", flexDirection: "column", gap: 6 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
                <Input multiline rows={1} maxLength={1000} value={text} placeholder={stage === 0 ? "Опишите свой сон…" : "Ответьте или задайте свой вопрос…"} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} style={{ flex: 1, minHeight: 48 }} />
                <Button size="sm" onClick={send} style={{ minHeight: 48 }}>Отправить</Button>
              </div>
              <span style={{ alignSelf: "flex-end", fontSize: "0.72rem", color: text.length >= 1000 ? "var(--danger-500)" : "var(--text-muted)" }}>{text.length}/1000</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function todayLabel() {
  const M = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const d = new Date();
  return d.getDate() + " " + M[d.getMonth()];
}

function formatDate(raw) {
  const M = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const d = new Date(raw);
  if (isNaN(d)) return raw;
  return d.getDate() + " " + M[d.getMonth()] + " " + d.getFullYear();
}

      <span aria-hidden="true" style={{ color: "var(--cyan-300)" }}>✦</span>{msg}
    </div>
  );
}

          const res = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.access_token}`,
            },
            body,
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data.payment_url) {
            window.location.href = data.payment_url;
          }
        } catch (err) {
          flash('Ошибка при оплате, попробуй ещё раз');
        }
      }
      function getNotebook() {
        const a = document.createElement("a"); a.href = "/workbook_analyse_dreams.pdf"; a.download = "workbook_analyse_dreams.pdf"; a.click();
      }
      async function signOut() {
        await window._supabase.auth.signOut();
      }
      function loadArchetypes() {
        authHeaders().then(headers => fetch('https://api.analysedreams.ru/symbols/archetypes', { headers }))
          .then(r => r.ok ? r.json() : null)
          .then(data => { if (data && Array.isArray(data.symbols)) setArchetypes(data); })
          .catch(() => {});
      }
      function completeAnalysis() {
        authHeaders().then(headers => fetch('https://api.analysedreams.ru/history/', { headers }))
          .then(r => r.ok ? r.json() : [])
          .then(data => { if (Array.isArray(data)) setHistory(data); })
          .catch(() => {});
        loadArchetypes();
      }
      function startAnalysis() {}
      function updateBalance(b) { setBalance(b); }
      async function cancelSubscription() {
        if (!confirm("Отменить подписку? Доступ сохранится до конца оплаченного периода.")) return;
        try {
          const { data: { session } } = await window._supabase.auth.getSession();
          const res = await fetch('https://api.analysedreams.ru/payment/subscription/cancel', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${session.access_token}` },
          });
          if (!res.ok) throw new Error();
          setSubscription(s => ({ ...s, active: false }));
          flash("Подписка отменена. Доступ действует до конца периода.");
        } catch {
          flash("Не удалось отменить подписку, попробуй ещё раз");
        }
      }
      function changeTab(t) {
        setFocusDreamId(null);
        setTab(t);
      }
      function openDreamFromArchetype(dreamId) {
        setSelectedArchetypeId(null);
        setFocusDreamId(dreamId);
        setTab("history");
      }
      function goTopUp() {
        setChatOpen(false);
        setPendingDream("");
        setTab("cabinet");
        flash("Выберите пакет разборов");
      }

      return (
        <React.Fragment>
          <div data-screen-label="Личный кабинет">
            <Header email={user.email} onSignOut={signOut} />
            <Tabs value={tab} onChange={changeTab} />
            {tab === "cabinet" ? (
              <div className="lk-stack">
                <BalanceCard balance={balance} subscription={subscription} onAnalyze={() => setChatOpen(true)} />
                <TariffGrid onBuy={buyTariff} tariffs={tariffs} />
                <NotebookCard onGet={getNotebook} />
                {subscription.active && <CancelSubscriptionLink onCancel={cancelSubscription} />}
              </div>
            ) : tab === "archetypes" ? (
              <ArchetypesTab archetypes={archetypes.symbols} connections={archetypes.connections} onSelect={setSelectedArchetypeId} onModel={() => setChatOpen(true)} />
            ) : (
              <HistoryList items={history} focusId={focusDreamId} />
            )}
          </div>
          <DreamChat open={chatOpen} balance={balance} onClose={() => { setChatOpen(false); setPendingDream(""); }} onStart={startAnalysis} onComplete={completeAnalysis} onGoTopUp={goTopUp} onBalanceUpdate={updateBalance} initialDream={pendingDream} email={user.email} />
          <ArchetypeDetail symbol={archetypes.symbols.find(s => s.id === selectedArchetypeId)} onClose={() => setSelectedArchetypeId(null)} onOpenDream={openDreamFromArchetype} />
          <Toast msg={toast} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>


</body></html>
