# Static site: main site at / , personal cabinet (lk) at /lk
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- /lk : personal cabinet ----
    location = /lk {
        return 301 /lk/;
    }

    location /lk/ {
        # unknown /lk/... paths fall back to the cabinet's index
        try_files $uri $uri/ /lk/index.html;
    }

    # ---- static assets: served as-is, cached for a week ----
    location ~* \.(?:html|css|js|mjs|json|xml|txt|png|jpe?g|gif|webp|svg|ico|pdf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- main site ----
    location / {
        # unknown paths fall back to the main index.html
        try_files $uri $uri/ /index.html;
    }
}